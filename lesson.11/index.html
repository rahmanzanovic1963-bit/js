<!DOCTYPE html>
<html lang="ru">
<head>

<title>Todo List</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Мой Todo</h1>

    <ul id="futerlist"></ul>

<script src="java.js"></script>
</body>
</html>
